apiVersion: 1

providers:
  - name: observability
    orgId: 1
    folder: Observabilité           # dossier dans lequel les dashboards apparaîtront
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30        # recharge les fichiers toutes les 30 s
    allowUiUpdates: true             # autorise les retouches dans l'UI (non persistées au fichier)
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false