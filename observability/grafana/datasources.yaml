apiVersion: 1

datasources:
  # ───────── Prometheus (métriques) ─────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # Lien métrique -> trace via les exemplars (clic depuis un graphe vers Tempo)
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # ───────── Loki (logs) ─────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Si tes logs contiennent un champ JSON "trace_id", on crée un lien vers Tempo
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  # ───────── Tempo (traces) ─────────
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Trace -> logs corrélés (saute vers Loki en filtrant sur le service)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        tags:
          - key: service.name
            value: compose_service
      # Trace -> métriques corrélées (vers Prometheus)
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      # Service map alimentée par le metrics-generator de Tempo
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToProfiles: {}
