# Config Tempo 2.6.x : stockage local (filesystem), réception OTLP,
# et metrics-generator (service graph + span metrics) renvoyés vers Prometheus.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h            # rétention des traces (ajustable)

# Génère des métriques à partir des traces (service map, latences par span)
# et les envoie à Prometheus via remote_write.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Active les processeurs du metrics-generator par défaut pour tous les services.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
