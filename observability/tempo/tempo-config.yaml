# Config Tempo 2.6.x : stockage local, réception OTLP, et metrics-generator
# avec local-blocks (requis pour les TraceQL metrics du "Drilldown traces").

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h            # rétention des traces (ajustable)

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  # Stockage des traces récentes : indispensable au processeur local-blocks
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: true        # persiste les blocs locaux
      filter_server_spans: false    # prend en compte TOUS les spans, pas que "server"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Autorise les TraceQL metrics (Drilldown) sur une fenêtre large
query_frontend:
  metrics:
    max_duration: 24h

# Active les 3 processeurs par défaut pour tous les services :
#  - service-graphs / span-metrics  -> service map & métriques RED
#  - local-blocks                   -> TraceQL metrics -> Drilldown traces
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]