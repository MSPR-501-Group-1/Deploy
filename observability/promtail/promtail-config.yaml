# Promtail découvre automatiquement TOUS les conteneurs Docker via le socket
# et pousse leurs logs vers Loki. Aucune config par service à maintenir.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nom du conteneur (on retire le "/" de tête)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Nom du service docker-compose (= label "compose_service")
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      # Projet docker-compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # stdout / stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
