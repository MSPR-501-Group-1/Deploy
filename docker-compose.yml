services:

  # ─────────────────────────────────────────
  #  BASE DE DONNÉES PostgreSQL
  # ─────────────────────────────────────────
  db-main:
    image: postgres:16-alpine
    container_name: database-main
    restart: unless-stopped
    init: true
    ports:
      - "5433:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database-main/01_initdb.sql:/docker-entrypoint-initdb.d/01_initdb.sql:ro
      - ./database-main/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  db-nut-reco:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: database-nutrition-recommendation
    restart: unless-stopped
    init: true
    ports:
      - "27018:27017"
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./database-nutrition-recommendation/scripts/init/initdb_v0.js:/docker-entrypoint-initdb.d/01_init.js:ro
      - ./database-nutrition-recommendation/schemas:/schemas:ro
      - ./database-nutrition-recommendation/scripts/seed/seed_v0.js:/seed/seed_v0.js:ro
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27018/${MONGO_DB} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # ─────────────────────────────────────────
  #  ETL Python
  # ─────────────────────────────────────────
  etl:
    build:
      context: ./data-etl
      dockerfile: Dockerfile
    container_name: etl
    restart: on-failure
    init: true
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env
    environment:
      DB_HOST: db-main
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_MASTER: local[*]
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_API_TOKEN}
    volumes:
      - ./data-etl/data:/app/data
      - ./data-etl/logs:/app/logs
    depends_on:
      db-main:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  IA WORKOUT RECOMMENDATION Python
  # ─────────────────────────────────────────
  ia-workout-recommendation:
    build:
      context: ./ia-workout-recommendation
      dockerfile: Dockerfile
    container_name: ia-workout-recommendation
    restart: unless-stopped
    init: true
    # TODO : Faut dégager le port quand on passera en prod (à la fin).
    # -> On appele le service depuis le backend (réseau interne docker)
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      OTEL_SERVICE_NAME: ia-workout-recommendation
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none       # métriques via /metrics (pull Prometheus)
      OTEL_LOGS_EXPORTER: none          # coupe l'export de logs qui spamme tes erreurs
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import requests; requests.get('http://127.0.0.1:8001/docs', timeout=5)\" || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  IA NUTRITION RECOMMENDATION Python
  # ─────────────────────────────────────────
  ia-nutrition-recommendation:
    build:
      context: ./ia-nutrition-recommendation
      dockerfile: Dockerfile
    container_name: ia-nutrition-recommendation
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./.env
    environment:
      DB_HOST: db-main
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db-nut-reco:27017/${MONGO_DB}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}

      environment:
      OTEL_SERVICE_NAME: ia-nutrition-recommendation
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-main:
        condition: service_healthy
      db-nut-reco:
        condition: service_started
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  BACKEND Node.js
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_HOST: db-nut-reco
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTH_DB: ${MONGO_AUTH_DB}
      JWT_SECRET: ${JWT_SECRET}
      ETL_API_URL: ${ETL_API_URL}

      environment:
      OTEL_SERVICE_NAME: backend
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"
    volumes:
      - ./data-etl/data/processed:/data/processed
    depends_on:
      db-main:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  FRONTEND React (Vite)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS}
    container_name: frontend
    restart: unless-stopped
    init: true
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - external

  # ─────────────────────────────────────────
  #  FRONTEND User-Coaching (Angular)
  # ─────────────────────────────────────────
  frontend-user-coaching:
    build:
      context: ./frontend-user-coaching
      dockerfile: Dockerfile
    container_name: frontend-user-coaching
    restart: unless-stopped
    init: true
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - external

  # ═════════════════════════════════════════════════════════════════════════
  #  OBSERVABILITÉ — Prometheus / Loki / Promtail / Tempo / Grafana
  # ═════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────
  #  PROMETHEUS — métriques
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    init: true
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'   # requis pour les métriques générées par Tempo
      - '--enable-feature=exemplar-storage'    # liens métriques -> traces (exemplars)
    networks:
      - internal

  # ─────────────────────────────────────────
  #  LOKI — logs
  # ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    init: true
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - internal

  # ─────────────────────────────────────────
  #  PROMTAIL — collecte auto des logs de TOUS les conteneurs
  # ─────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    init: true
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - internal

  # ─────────────────────────────────────────
  #  TEMPO — traces (épinglé 2.6.1 : pas de dépendance Kafka/Redpanda)
  # ─────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    init: true
    ports:
      - "3200:3200"   # API HTTP Tempo
      - "4317:4317"   # OTLP gRPC  (réception des traces)
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - internal

  # ─────────────────────────────────────────
  #  GRAFANA — visualisation unifiée
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    init: true
    ports:
      - "3001:3000"   # 3000 est déjà pris par ton backend -> Grafana sur 3001
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      GF_LOG_FILTERS: "authn.service:error"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - internal

# ─────────────────────────────────────────
#  VOLUMES & RÉSEAUX
# ─────────────────────────────────────────
volumes:
  pgdata:
  mongodb_data:
  prometheus_data:
  loki_data:
  promtail_data:
  tempo_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge