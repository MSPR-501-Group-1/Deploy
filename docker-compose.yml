services:

  # ─────────────────────────────────────────
  #  BASE DE DONNÉES PostgreSQL
  # ─────────────────────────────────────────
  db-main:
    image: postgres:16-alpine
    container_name: database-main
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database-main/01_initdb.sql:/docker-entrypoint-initdb.d/01_initdb.sql:ro
      - ./database-main/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  db-nut-reco:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: database-nutrition-recommendation
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: healthai_nutrition_recommendation
    volumes:
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/01_init.js:ro
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/healthai_nutrition_recommendation --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # ─────────────────────────────────────────
  #  ETL Python
  # ─────────────────────────────────────────
  etl:
    build:
      context: ./data-etl
      dockerfile: Dockerfile
    container_name: etl
    restart: on-failure
    init: true
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env
    environment:
      DB_HOST: db-main
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_MASTER: local[*]
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_API_TOKEN}
    volumes:
      - ./data-etl/data:/app/data
      - ./data-etl/logs:/app/logs
    depends_on:
      db-main:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  BACKEND Node.js
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend-main
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      POSTGRES_HOST: db-main
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ETL_API_URL: ${ETL_API_URL}
    volumes:
      - ./data-etl/data/processed:/data/processed
    depends_on:
      db-main:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - internal
      - external

  # ─────────────────────────────────────────
  #  FRONTEND React (Vite)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-admin-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS}
    container_name: frontend
    restart: unless-stopped
    init: true
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - external

# ─────────────────────────────────────────
#  VOLUMES & RÉSEAUX
# ─────────────────────────────────────────
volumes:
  pgdata:
  mongodb_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
